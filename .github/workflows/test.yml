# CI/CD Pipeline — Automated Testing
# Chạy tự động khi push/PR vào main

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - run: npm ci

      # Typecheck
      - run: npx tsc --noEmit

      # Run tests
      - run: npm test

      # Run tests with coverage
      - run: npm run test:coverage

      # Build
      - run: npm run build

      # Upload test report (optional)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report/
          retention-days: 7
