# Publish to npm + GitHub Packages
# Trigger: push tag v* (e.g., v0.1.0, v1.0.0)
# Prerequisites:
#   1. Create npm account at https://www.npmjs.com
#   2. Get npm token: npm login → npm token create (Classic → Automation)
#   3. Add NPM_TOKEN to GitHub repo Secrets

name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout code
      - uses: actions/checkout@v7

      # Setup Node.js for npm
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Install dependencies
      - run: npm ci

      # Typecheck
      - run: npx tsc --noEmit

      # Run tests
      - run: npm test

      # Build
      - run: npm run build

      # Publish to npm (primary)
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Setup Node.js for GitHub Packages
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hieujojo"

      # Publish to GitHub Packages (secondary)
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
